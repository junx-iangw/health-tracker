<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Log">
<meta name="theme-color" content="#0f1117">
<title>Health Log</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0f1117;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* HEADER */
  .header {
    padding: max(52px, env(safe-area-inset-top, 16px) + 16px) 16px 14px;
    border-bottom: 1px solid #1f2937;
    position: sticky;
    top: 0;
    background: #0f1117;
    z-index: 50;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.12em; color: #5eead4; text-transform: uppercase; margin-bottom: 4px; font-family: monospace; }
  .header h1 { font-size: 22px; font-weight: 700; color: #f0f0f0; }
  .header h1 span { color: #5eead4; }

  /* FILTER */
  .filter-row { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid #1f2937; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid #1f2937; background: transparent; color: #6b7280; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: monospace; transition: all 0.15s; }
  .filter-btn.active { border-color: #5eead4; background: #0d2626; color: #5eead4; }

  /* ENTRIES */
  .entries { padding-bottom: 100px; }
  .day-block { padding: 14px 16px 0; }
  .day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .day-label { font-family: monospace; font-size: 10px; background: #5eead4; color: #0f1117; padding: 2px 8px; border-radius: 4px; font-weight: 700; letter-spacing: 0.06em; }
  .day-title { font-size: 13px; color: #9ca3af; }

  .entry-card { background: #161b25; border: 1px solid #1f2937; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .entry-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .time-label { font-family: monospace; font-size: 10px; color: #4b5563; min-width: 52px; padding-top: 3px; }
  .item-text { font-size: 13px; color: #e2e8f0; flex: 1; line-height: 1.4; }
  .notes-text { font-size: 12px; color: #6b7280; margin-left: 60px; line-height: 1.4; margin-top: 2px; }

  .pill { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; margin-right: 4px; }
  .pill-exercise { background: #1c3a5e; color: #93c5fd; }
  .pill-food     { background: #1e3a2a; color: #86efac; }
  .pill-drink    { background: #2a1e3a; color: #c4b5fd; }
  .pill-weight   { background: #3a2a1e; color: #fcd34d; }
  .pill-note     { background: #2a1a1a; color: #fca5a5; }

  .flag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 3px; margin-left: 6px; }
  .flag-good { background: #14321e; color: #4ade80; }
  .flag-warn { background: #431407; color: #fb923c; }

  .entry-actions { display: flex; gap: 12px; margin-top: 6px; margin-left: 60px; }
  .entry-actions button { font-size: 11px; background: transparent; border: none; cursor: pointer; padding: 2px 0; }
  .btn-edit   { color: #5eead4; }
  .btn-delete { color: #f87171; }

  .divider { height: 1px; background: linear-gradient(to right, #1f2937, transparent); margin: 14px 16px 0; }

  /* EMPTY */
  .empty { text-align: center; padding: 60px 20px; color: #4b5563; font-size: 14px; }

  /* FAB */
  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 20px; background: #5eead4; color: #0f1117; border: none; border-radius: 50%; width: 54px; height: 54px; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 4px 20px rgba(94,234,212,0.35); z-index: 100; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: flex-end; }
  .modal-box { background: #161b25; border-radius: 16px 16px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-height: 92vh; overflow-y: auto; border-top: 1px solid #1f2937; }
  .modal-title { font-size: 16px; font-weight: 700; color: #f0f0f0; margin-bottom: 16px; }

  .form-label { display: block; font-size: 11px; color: #6b7280; font-family: monospace; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; margin-top: 14px; }
  .form-input, .form-select { width: 100%; background: #0f1117; border: 1px solid #1f2937; border-radius: 8px; padding: 10px 12px; color: #e8e8e8; font-size: 14px; outline: none; -webkit-appearance: none; }
  .form-input:focus, .form-select:focus { border-color: #5eead4; }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-save   { flex: 1; background: #5eead4; color: #0f1117; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-cancel { flex: 1; background: transparent; color: #6b7280; border: 1px solid #1f2937; border-radius: 10px; padding: 13px; font-size: 15px; cursor: pointer; }

  /* CONFIRM */
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .confirm-box { background: #161b25; border: 1px solid #1f2937; border-radius: 14px; padding: 20px; width: 100%; max-width: 300px; }
  .confirm-text { font-size: 14px; color: #e2e8f0; margin-bottom: 16px; }
  .confirm-btns { display: flex; gap: 10px; }
  .btn-confirm-delete { flex: 1; background: #7f1d1d; color: #fca5a5; border: none; border-radius: 8px; padding: 11px; font-size: 13px; cursor: pointer; }
  .btn-confirm-cancel { flex: 1; background: transparent; color: #6b7280; border: 1px solid #1f2937; border-radius: 8px; padding: 11px; font-size: 13px; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: #1f2937; color: #5eead4; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-family: monospace; z-index: 400; border: 1px solid #374151; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Personal Log</div>
  <h1>Health <span>&amp; Activity</span> Tracker</h1>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="entries" id="entries"></div>

<button class="fab" id="fabBtn">+</button>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Add Entry</div>
    <label class="form-label">Date</label>
    <input class="form-input" type="date" id="fDate">
    <label class="form-label">Time</label>
    <input class="form-input" type="text" id="fTime" placeholder="e.g. Morning, 12:30, Night">
    <label class="form-label">Type</label>
    <select class="form-select" id="fType">
      <option value="food">Food</option>
      <option value="exercise">Exercise</option>
      <option value="drink">Drink</option>
      <option value="weight">Weight</option>
      <option value="note">Note</option>
    </select>
    <label class="form-label">Item</label>
    <input class="form-input" type="text" id="fItem" placeholder="e.g. 5km jog, Chicken rice, Green tea">
    <label class="form-label">Notes</label>
    <input class="form-input" type="text" id="fNotes" placeholder="Optional details">
    <label class="form-label">Flag</label>
    <select class="form-select" id="fFlag">
      <option value="none">None</option>
      <option value="good">✓ Good</option>
      <option value="warn">⚠ Watch</option>
    </select>
    <div class="btn-row">
      <button class="btn-save" id="btnSave">Add Entry</button>
      <button class="btn-cancel" id="btnCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-text">Delete this entry? This cannot be undone.</div>
    <div class="confirm-btns">
      <button class="btn-confirm-delete" id="btnConfirmDelete">Delete</button>
      <button class="btn-confirm-cancel" id="btnConfirmCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script>
const STORAGE_KEY = "jx_health_tracker_v2";

const TYPE_CONFIG = {
  exercise: { label: "Exercise", pillClass: "pill-exercise" },
  food:     { label: "Food",     pillClass: "pill-food" },
  drink:    { label: "Drink",    pillClass: "pill-drink" },
  weight:   { label: "Weight",  pillClass: "pill-weight" },
  note:     { label: "Note",    pillClass: "pill-note" },
};

const FLAG_CONFIG = {
  good: { label: "✓ Good", cls: "flag-good" },
  warn: { label: "⚠ Watch", cls: "flag-warn" },
  none: null,
};

const SEED = [
  { id:"s1",  date:"2026-06-24", time:"Morning",    type:"exercise", item:"5km jog",                                    notes:"Avg HR 145bpm",                        flag:"warn" },
  { id:"s2",  date:"2026-06-24", time:"Afternoon",  type:"food",     item:"Acai bowl",                                  notes:"~40–60g sugar, granola, honey drizzle", flag:"warn" },
  { id:"s3",  date:"2026-06-24", time:"Throughout", type:"drink",    item:"Green tea ~1.5L",                            notes:"3 cups × 500ml",                       flag:"good" },
  { id:"s4",  date:"2026-06-24", time:"Evening",    type:"food",     item:"Spicy tonkatsu cup noodle (with soup)",      notes:"~1,500–2,000mg sodium",                flag:"warn" },
  { id:"s5",  date:"2026-06-24", time:"Evening",    type:"food",     item:"Banana",                                     notes:"Good potassium source",                flag:"good" },
  { id:"s6",  date:"2026-06-24", time:"Night",      type:"note",     item:"Bloating & low urine output",               notes:"Sodium-driven water retention",        flag:"warn" },
  { id:"s7",  date:"2026-06-24", time:"Morning",    type:"weight",   item:"Weight: 66.7kg",                            notes:"Fasted morning weight",                flag:"none" },
  { id:"s8",  date:"2026-06-25", time:"07:30",      type:"weight",   item:"Weight: 66.2kg",                            notes:"Fasted morning weight ↓0.5kg",         flag:"good" },
  { id:"s9",  date:"2026-06-25", time:"Morning",    type:"exercise", item:"Incline walk — gradient 12, pace 5, 2km",   notes:"Zone 2 fat burning",                   flag:"good" },
  { id:"s10", date:"2026-06-25", time:"Morning",    type:"exercise", item:"Bicep curls — 6 sets at 25kg",              notes:"Strength work, metabolic boost",       flag:"good" },
  { id:"s11", date:"2026-06-25", time:"Afternoon",  type:"drink",    item:"Matcha oat milk 350ml (5% sugar)",          notes:"~17–18g sugar",                        flag:"none" },
  { id:"s12", date:"2026-06-25", time:"Afternoon",  type:"drink",    item:"Natural sugar cane juice",                  notes:"~30–45g sugar",                        flag:"warn" },
  { id:"s13", date:"2026-06-25", time:"12:30",      type:"food",     item:"Grilled chicken chop + 15 crinkle fries",   notes:"Solid protein, moderate carbs",        flag:"good" },
  { id:"s14", date:"2026-06-25", time:"12:30",      type:"food",     item:"5 grilled chicken wings",                   notes:"Good protein, grilled not fried",      flag:"good" },
  { id:"s15", date:"2026-06-25", time:"12:30",      type:"drink",    item:"Espresso",                                  notes:"No sugar or milk — clean",             flag:"good" },
  { id:"s16", date:"2026-06-25", time:"Throughout", type:"drink",    item:"Plenty of plain water",                     notes:"Sodium flush from Day 1",              flag:"good" },
  { id:"s17", date:"2026-06-25", time:"18:00",      type:"food",     item:"Fried chicken thigh wrap (no sauce)",       notes:"Good protein, no hidden calories",     flag:"good" },
  { id:"s18", date:"2026-06-25", time:"19:30",      type:"food",     item:"Yellow kiwi + few apple slices",            notes:"Moderate sugar, potassium & Vit C",    flag:"good" },
  { id:"s19", date:"2026-06-25", time:"21:00",      type:"food",     item:"Raw unsalted pumpkin seeds (small handful)",notes:"Magnesium, protein, healthy fats",     flag:"good" },
  { id:"s20", date:"2026-06-25", time:"21:07",      type:"weight",   item:"Weight: 66.8kg",                            notes:"Evening — normal post-meal fluctuation",flag:"none" },
];

let entries = [];
let filterType = "all";
let editId = null;
let deleteTargetId = null;

function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    entries = saved ? JSON.parse(saved) : SEED;
  } catch { entries = SEED; }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch {}
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function formatDate(d) {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-SG", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
}

function groupByDate(arr) {
  const map = {};
  arr.forEach(e => { if (!map[e.date]) map[e.date] = []; map[e.date].push(e); });
  return Object.entries(map).sort((a,b) => b[0].localeCompare(a[0]));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
}

function renderFilters() {
  const row = document.getElementById("filterRow");
  const types = [["all","All"], ...Object.entries(TYPE_CONFIG).map(([k,v]) => [k, v.label])];
  row.innerHTML = types.map(([k,l]) =>
    `<button class="filter-btn${filterType===k?" active":""}" onclick="setFilter('${k}')">${l}</button>`
  ).join("");
}

function renderEntries() {
  const container = document.getElementById("entries");
  const filtered = filterType === "all" ? entries : entries.filter(e => e.type === filterType);
  const grouped = groupByDate(filtered);

  if (grouped.length === 0) {
    container.innerHTML = `<div class="empty">No entries yet.<br>Tap + to add your first entry.</div>`;
    return;
  }

  container.innerHTML = grouped.map(([date, dayEntries], i) => `
    ${i > 0 ? '<div class="divider"></div>' : ''}
    <div class="day-block">
      <div class="day-header">
        <span class="day-label">DAY</span>
        <span class="day-title">${formatDate(date)}</span>
      </div>
      ${dayEntries.map(e => {
        const tc = TYPE_CONFIG[e.type];
        const fc = FLAG_CONFIG[e.flag];
        return `
        <div class="entry-card">
          <div class="entry-top">
            <span class="time-label">${e.time || ""}</span>
            <span class="pill ${tc.pillClass}">${tc.label}</span>
            <span class="item-text">${e.item}</span>
          </div>
          ${e.notes ? `<div class="notes-text">${e.notes}${fc ? `<span class="flag ${fc.cls}">${fc.label}</span>` : ""}</div>` : ""}
          <div class="entry-actions">
            <button class="btn-edit" onclick="openEdit('${e.id}')">Edit</button>
            <button class="btn-delete" onclick="confirmDelete('${e.id}')">Delete</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  `).join("");
}

function render() { renderFilters(); renderEntries(); }

function setFilter(type) { filterType = type; render(); }

function getTodayStr() { return new Date().toISOString().slice(0,10); }

function openAdd() {
  editId = null;
  document.getElementById("modalTitle").textContent = "Add Entry";
  document.getElementById("fDate").value = getTodayStr();
  document.getElementById("fTime").value = "";
  document.getElementById("fType").value = "food";
  document.getElementById("fItem").value = "";
  document.getElementById("fNotes").value = "";
  document.getElementById("fFlag").value = "none";
  document.getElementById("btnSave").textContent = "Add Entry";
  document.getElementById("modalOverlay").style.display = "flex";
}

function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editId = id;
  document.getElementById("modalTitle").textContent = "Edit Entry";
  document.getElementById("fDate").value = e.date;
  document.getElementById("fTime").value = e.time;
  document.getElementById("fType").value = e.type;
  document.getElementById("fItem").value = e.item;
  document.getElementById("fNotes").value = e.notes || "";
  document.getElementById("fFlag").value = e.flag || "none";
  document.getElementById("btnSave").textContent = "Save Changes";
  document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
  editId = null;
}

function saveEntry() {
  const item = document.getElementById("fItem").value.trim();
  if (!item) return;
  const entry = {
    date:  document.getElementById("fDate").value,
    time:  document.getElementById("fTime").value.trim(),
    type:  document.getElementById("fType").value,
    item,
    notes: document.getElementById("fNotes").value.trim(),
    flag:  document.getElementById("fFlag").value,
  };
  if (editId) {
    entries = entries.map(e => e.id === editId ? { ...entry, id: editId } : e);
    showToast("Entry updated");
  } else {
    entries.push({ ...entry, id: uid() });
    showToast("Entry added");
  }
  save(); closeModal(); render();
}

function confirmDelete(id) {
  deleteTargetId = id;
  document.getElementById("confirmOverlay").style.display = "flex";
}

function doDelete() {
  entries = entries.filter(e => e.id !== deleteTargetId);
  save(); render();
  document.getElementById("confirmOverlay").style.display = "none";
  showToast("Entry deleted");
}

// Event listeners
document.getElementById("fabBtn").addEventListener("click", openAdd);
document.getElementById("btnSave").addEventListener("click", saveEntry);
document.getElementById("btnCancel").addEventListener("click", closeModal);
document.getElementById("btnConfirmDelete").addEventListener("click", doDelete);
document.getElementById("btnConfirmCancel").addEventListener("click", () => {
  document.getElementById("confirmOverlay").style.display = "none";
});

// Init
load(); render();
</script>
</body>
</html>
